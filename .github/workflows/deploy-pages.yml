name: Deploy GitHub Pages

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest main for branch preview
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Write build info
        shell: bash
        run: |
          cat > dist/build-info.json <<EOF
          {
            "sourceBranch": "${GITHUB_REF_NAME}",
            "sourceSha": "${GITHUB_SHA}",
            "builtSha": "$(git rev-parse HEAD)",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Add Pages marker
        run: touch dist/.nojekyll

      - name: Resolve deploy destination
        id: deploy-target
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ]; then
            echo "destination=." >> "$GITHUB_OUTPUT"
            echo "url=https://frankprogrammer.github.io/magus-match-html5/" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          slug="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+|-+$##g; s#-+#-#g')"
          if [ -z "$slug" ]; then
            slug="branch-${GITHUB_SHA::7}"
          fi

          echo "destination=branches/$slug" >> "$GITHUB_OUTPUT"
          echo "url=https://frankprogrammer.github.io/magus-match-html5/branches/$slug/" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ steps.deploy-target.outputs.destination }}
          keep_files: true

      - name: Print deployed URL
        run: echo "${{ steps.deploy-target.outputs.url }}"
